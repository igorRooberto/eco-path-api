spring:
  application:
    name: EcoPathAPI

  open:
    route:
      url: https://api.heigit.org/openrouteservice/v2/directions/foot-walking
      token: ${ORS_TOKEN}

  datasource:
    url: jdbc:h2:mem:ecopathdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
      show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console